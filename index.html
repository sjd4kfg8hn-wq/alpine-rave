<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine Rave 3000m - DJ Booth</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(10, 15, 30, 0.5), rgba(10, 15, 30, 0.7)), url('./images/dj_booth.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.75);
            width: 100%;
            border-bottom: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 3px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }

        header p {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 3px;
        }

        .dj-booth-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            width: 100%;
            max-width: 1300px;
            margin: auto;
        }

        .deck {
            background: rgba(15, 20, 30, 0.85);
            border: 2px solid #333;
            border-radius: 15px;
            padding: 25px;
            width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .deck h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #ff007f;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .turntable {
            width: 160px;
            height: 160px;
            background: #111;
            border-radius: 50%;
            margin: 15px auto;
            border: 6px solid #222;
            box-shadow: 0 0 15px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,255,204,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: spin 10s linear infinite;
            animation-play-state: paused;
        }

        .turntable.playing {
            animation-play-state: running;
            box-shadow: 0 0 20px rgba(255,0,127,0.5), inset 0 0 15px rgba(0,255,204,0.4);
        }

        .turntable-center {
            width: 50px;
            height: 50px;
            background: #ff007f;
            border-radius: 50%;
            border: 3px solid #fff;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .track-selector {
            margin-top: 15px;
            text-align: left;
        }

        .track-selector label {
            display: block;
            font-size: 0.8rem;
            color: #bbb;
            margin-bottom: 5px;
        }

        .track-selector select {
            width: 100%;
            padding: 10px;
            background: #111;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .track-selector select:focus {
            border-color: #00ffcc;
        }

        .deck-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-play {
            flex: 1;
            padding: 10px;
            background: #00ffcc;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-play:hover {
            background: #00cca3;
            box-shadow: 0 0 10px rgba(0,255,204,0.6);
        }

        .btn-pause {
            flex: 1;
            padding: 10px;
            background: #ff007f;
            color: #fff;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-pause:hover {
            background: #d00067;
            box-shadow: 0 0 10px rgba(255,0,127,0.6);
        }

        /* Ocultar el iframe visualmente pero mantenerlo activo en DOM */
        .hidden-player {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .mixer-controls {
            background: rgba(10, 15, 25, 0.95);
            border-top: 2px solid #00ffcc;
            padding: 20px 40px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.8);
        }

        .fader-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .fader-group label {
            font-size: 0.8rem;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 220px;
            background: #222;
            height: 6px;
            border-radius: 3px;
            outline: none;
            border: 1px solid #444;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff007f;
            cursor: pointer;
            box-shadow: 0 0 8px #ff007f;
        }

        footer {
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.9);
            width: 100%;
            font-size: 0.75rem;
            color: #666;
        }

        @media (max-width: 900px) {
            .deck {
                width: 100%;
                max-width: 450px;
            }
            .mixer-controls {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>ALPINE RAVE 3000M</h1>
        <p>High-Altitude Afro-House DJ Booth | Dual Deck Experience</p>
    </header>

    <div class="dj-booth-container">
        <!-- DECK A -->
        <div class="deck" id="deck-a-box">
            <h2>Deck A <span>[Master A]</span></h2>
            <div class="turntable" id="vinyl-a">
                <div class="turntable-center"></div>
            </div>
            <div class="track-selector">
                <label for="select-a">Seleccionar Track (Deck A):</label>
                <select id="select-a" onchange="onTrackChange('a')">
                    <option value="https://soundcloud.com/aaron-sevilla/afrohouse-mesa-que-ma-s">1. Mesa que más aplauda</option>
                    <option value="https://soundcloud.com/aaron-sevilla/valgame-dios">2. Válgame Dios</option>
                    <option value="https://soundcloud.com/aaron-sevilla/aaron-sevilla-afrodise-tulum">3. Afrodise Tulum</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afrohouse-habibi-weinak">4. Habibi Weinak</option>
                    <option value="https://soundcloud.com/aaron-sevilla/aaron-sevilla-afrohouse-dj-set-at-mia-tulum">5. Live at Mia Tulum</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afrohouse-interestellar">6. Interestellar</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afrohouse-tengo" selected>7. Tengo</option>
                    <option value="https://soundcloud.com/aaron-sevilla/aaron-sevilla-afrodise-dubai-afro-house">8. Afrodise Dubai</option>
                    <option value="https://soundcloud.com/aaron-sevilla/aaron-sevilla-plaza-espana">9. Plaza España Set</option>
                    <option value="https://soundcloud.com/aaron-sevilla/desa-kitsune-bali-2025-afro-house-afro-latin-house">10. Desa Kitsune Bali</option>
                </select>
            </div>
            <div class="deck-btns">
                <button class="btn-play" onclick="playTrack('a')">PLAY</button>
                <button class="btn-pause" onclick="pauseTrack('a')">STOP</button>
            </div>
            <!-- Reproductor SoundCloud Oculto con URL base inicializada -->
            <div class="hidden-player">
                <iframe id="sc-player-a" width="100%" height="166" scrolling="no" frameborder="no" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/afrohouse-tengo&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false"></iframe>
            </div>
        </div>

        <!-- DECK B -->
        <div class="deck" id="deck-b-box">
            <h2>Deck B <span>[Master B]</span></h2>
            <div class="turntable" id="vinyl-b">
                <div class="turntable-center"></div>
            </div>
            <div class="track-selector">
                <label for="select-b">Seleccionar Track (Deck B):</label>
                <select id="select-b" onchange="onTrackChange('b')">
                    <option value="https://soundcloud.com/aaron-sevilla/afrohouse-jaguar" selected>1. Jaguar</option>
                    <option value="https://soundcloud.com/aaron-sevilla/caracas-venezuela-techraza-exclusive-afro-house-dj-set">2. Caracas Techraza Exclusive</option>
                    <option value="https://soundcloud.com/aaron-sevilla/el-rey">3. El Rey</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afrohouse-01-a-dos-amigos">4. A Dos Amigos</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afro-house-dj-set-at-yona-beach-2025">5. Yona Beach 2025</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afrohouse-da-iubirea-mai-tare">6. Da Iubirea Mai Tare</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afro-house-aaronsevilla-3">7. AaronSevilla 3</option>
                    <option value="https://soundcloud.com/aaron-sevilla/aaron-sevilla-at-cova-santa-ibiza">8. Cova Santa Ibiza</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afrohouse-aaronsevilla-1">9. AaronSevilla 1</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afro-house-aaron-sevilla-8">10. Aaron Sevilla 8</option>
                </select>
            </div>
            <div class="deck-btns">
                <button class="btn-play" onclick="playTrack('b')">PLAY</button>
                <button class="btn-pause" onclick="pauseTrack('b')">STOP</button>
            </div>
            <!-- Reproductor SoundCloud Oculto con URL base inicializada -->
            <div class="hidden-player">
                <iframe id="sc-player-b" width="100%" height="166" scrolling="no" frameborder="no" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/afrohouse-jaguar&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false"></iframe>
            </div>
        </div>
    </div>

    <!-- MESA DE MEZCLAS CENTRAL -->
    <div class="mixer-controls">
        <div class="fader-group">
            <label>Master Volume</label>
            <input type="range" id="master-volume" min="0" max="100" value="80" oninput="updateMasterVolume()">
        </div>
        <div class="fader-group">
            <label>Crossfader [Deck A &lt;-&gt; Deck B]</label>
            <input type="range" id="crossfader" min="0" max="100" value="50" oninput="updateCrossfader()">
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Alpine Rave 3000m Project | Built for high-altitude sessions</p>
    </footer>

    <!-- SoundCloud Widget API Script -->
    <script src="https://w.soundcloud.com/player/api.js"></script>
    <script>
        const widgetA = SC.Widget(document.getElementById('sc-player-a'));
        const widgetB = SC.Widget(document.getElementById('sc-player-b'));

        function playTrack(deck) {
            const widget = deck === 'a' ? widgetA : widgetB;
            const vinyl = document.getElementById(`vinyl-${deck}`);
            
            widget.play();
            vinyl.classList.add('playing');
        }

        function pauseTrack(deck) {
            const widget = deck === 'a' ? widgetA : widgetB;
            const vinyl = document.getElementById(`vinyl-${deck}`);
            
            widget.pause();
            vinyl.classList.remove('playing');
        }

        function onTrackChange(deck) {
            const selectVal = document.getElementById(`select-${deck}`).value;
            const widget = deck === 'a' ? widgetA : widgetB;
            const vinyl = document.getElementById(`vinyl-${deck}`);

            widget.load(selectVal, {
                callback: function() {
                    widget.play();
                    vinyl.classList.add('playing');
                }
            });
        }

        function updateMasterVolume() {
            const vol = document.getElementById('master-volume').value;
            widgetA.setVolume(vol);
            widgetB.setVolume(vol);
        }

        function updateCrossfader() {
            const val = document.getElementById('crossfader').value;
            const masterVol = document.getElementById('master-volume').value;
            
            // Si el crossfader está en el centro (50), ambos suenan al 100% del volumen maestro.
            // Si va hacia la izquierda (0), baja el deck B. Si va a la derecha (100), baja el deck A.
            let volA = masterVol;
            let volB = masterVol;

            if (val < 50) {
                volB = masterVol * (val / 50);
            } else if (val > 50) {
                volA = masterVol * ((100 - val) / 50);
            }

            widgetA.setVolume(volA);
            widgetB.setVolume(volB);
        }
    </script>

</body>
</html>
