<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine Rave 3000m - DJ Booth</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: url('images/dj_booth.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 30, 0.75);
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            width: 100%;
            border-bottom: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
        }

        header h1 {
            font-size: 2.2rem;
            letter-spacing: 3px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }

        header p {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }

        .dj-booth-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            width: 100%;
            max-width: 1400px;
            margin: auto;
        }

        .deck {
            background: rgba(20, 25, 40, 0.85);
            border: 2px solid #222;
            border-radius: 15px;
            padding: 20px;
            width: 450px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .deck h2 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: #ff007f;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .track-selector {
            margin-bottom: 15px;
        }

        .track-selector label {
            display: block;
            font-size: 0.85rem;
            color: #bbb;
            margin-bottom: 5px;
        }

        .track-selector select {
            width: 100%;
            padding: 10px;
            background: #111;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .track-selector select:focus {
            border-color: #00ffcc;
        }

        .player-frame {
            width: 100%;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin-bottom: 15px;
            border: 1px solid #333;
        }

        .mixer-controls {
            background: rgba(15, 20, 30, 0.9);
            border-top: 2px solid #00ffcc;
            padding: 15px 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.6);
        }

        .fader-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .fader-group label {
            font-size: 0.8rem;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 200px;
            background: #333;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff007f;
            cursor: pointer;
            box-shadow: 0 0 8px #ff007f;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: rgba(0,0,0,0.8);
            width: 100%;
            font-size: 0.8rem;
            color: #666;
        }

        @media (max-width: 950px) {
            .deck {
                width: 100%;
                max-width: 500px;
            }
            .mixer-controls {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>ALPINE RAVE 3000M</h1>
        <p>High-Altitude Afro-House DJ Booth | Dual Deck Experience</p>
    </header>

    <div class="dj-booth-container">
        <!-- DECK A -->
        <div class="deck" id="deck-a">
            <h2>Deck A <span>[Afrohouse Master]</span></h2>
            <div class="track-selector">
                <label for="select-a">Seleccionar Track (Deck A):</label>
                <select id="select-a" onchange="changeTrack('a')">
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/afrohouse-mesa-que-ma-s&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">1. Mesa que más aplauda</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/valgame-dios&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">2. Válgame Dios</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/aaron-sevilla-afrodise-tulum&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">3. Afrodise Tulum</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/afrohouse-habibi-weinak&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">4. Habibi Weinak</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/aaron-sevilla-afrohouse-dj-set-at-mia-tulum&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">5. Live at Mia Tulum</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/afrohouse-interestellar&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">6. Interestellar</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/afrohouse-tengo&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false" selected>7. Tengo</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/aaron-sevilla-afrodise-dubai-afro-house&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">8. Afrodise Dubai</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/aaron-sevilla-plaza-espana&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">9. Plaza España Set</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/desa-kitsune-bali-2025-afro-house-afro-latin-house&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">10. Desa Kitsune Bali</option>
                </select>
            </div>
            <div class="player-frame">
                <iframe id="sc-player-a" width="100%" height="120" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/afrohouse-tengo&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false"></iframe>
            </div>
        </div>

        <!-- DECK B -->
        <div class="deck" id="deck-b">
            <h2>Deck B <span>[Afrohouse Master]</span></h2>
            <div class="track-selector">
                <label for="select-b">Seleccionar Track (Deck B):</label>
                <select id="select-b" onchange="changeTrack('b')">
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/afrohouse-jaguar&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false" selected>1. Jaguar</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/caracas-venezuela-techraza-exclusive-afro-house-dj-set&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">2. Caracas Techraza Exclusive</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/el-rey&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">3. El Rey</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/afrohouse-01-a-dos-amigos&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">4. A Dos Amigos</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/afro-house-dj-set-at-yona-beach-2025&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">5. Yona Beach 2025</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/afrohouse-da-iubirea-mai-tare&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">6. Da Iubirea Mai Tare</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/afro-house-aaronsevilla-3&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">7. AaronSevilla 3</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/aaron-sevilla-at-cova-santa-ibiza&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">8. Cova Santa Ibiza</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/afrohouse-aaronsevilla-1&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">9. AaronSevilla 1</option>
                    <option value="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/afro-house-aaron-sevilla-8&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">10. Aaron Sevilla 8</option>
                </select>
            </div>
            <div class="player-frame">
                <iframe id="sc-player-b" width="100%" height="120" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/afrohouse-jaguar&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false"></iframe>
            </div>
        </div>
    </div>

    <!-- CENTRAL MIXER CONSOLE -->
    <div class="mixer-controls">
        <div class="fader-group">
            <label>Master Volume</label>
            <input type="range" min="0" max="100" value="80">
        </div>
        <div class="fader-group">
            <label>Crossfader [Deck A &lt;-&gt; Deck B]</label>
            <input type="range" min="0" max="100" value="50">
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Alpine Rave 3000m Project | Built for high-altitude sessions</p>
    </footer>

    <script>
        function changeTrack(deck) {
            const select = document.getElementById(`select-${deck}`);
            const player = document.getElementById(`sc-player-${deck}`);
            player.src = select.value;
        }
    </script>

</body>
</html>
