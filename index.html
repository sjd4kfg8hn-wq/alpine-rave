<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine Rave 3000m - DJ Booth</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(10, 15, 30, 0.45), rgba(10, 15, 30, 0.65)), url('./images/dj_booth.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.65);
            width: 100%;
            border-bottom: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            backdrop-filter: blur(5px);
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 3px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }

        header p {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 3px;
        }

        .dj-booth-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            width: 100%;
            max-width: 1300px;
            margin: auto;
        }

        /* Paneles con cristal translúcido para ver la imagen de fondo */
        .deck {
            background: rgba(10, 15, 25, 0.35);
            border: 1px solid rgba(0, 255, 204, 0.25);
            border-radius: 15px;
            padding: 20px 25px;
            width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            text-align: center;
        }

        .deck h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #ff007f;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Vúmetro / Barras de ecualizador multicolor */
        .equalizer-container {
            height: 50px;
            width: 140px;
            margin: 10px auto 15px auto;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 6px;
            padding: 4px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.2);
        }

        .eq-bar {
            width: 10px;
            height: 15%;
            background: linear-gradient(to top, #00ffcc 0%, #ff007f 60%, #ffe600 100%);
            border-radius: 2px;
            transition: height 0.15s ease-in-out;
            box-shadow: 0 0 6px rgba(255, 0, 127, 0.5);
        }

        /* Animación fluida de las barras cuando está reproduciendo */
        .playing .eq-bar:nth-child(1) { animation: bounce 0.45s infinite alternate ease-in-out; }
        .playing .eq-bar:nth-child(2) { animation: bounce 0.35s infinite alternate ease-in-out 0.1s; }
        .playing .eq-bar:nth-child(3) { animation: bounce 0.55s infinite alternate ease-in-out 0.2s; }
        .playing .eq-bar:nth-child(4) { animation: bounce 0.40s infinite alternate ease-in-out 0.05s; }
        .playing .eq-bar:nth-child(5) { animation: bounce 0.50s infinite alternate ease-in-out 0.15s; }
        .playing .eq-bar:nth-child(6) { animation: bounce 0.38s infinite alternate ease-in-out 0.25s; }

        @keyframes bounce {
            0% { height: 15%; }
            50% { height: 95%; }
            100% { height: 40%; }
        }

        .track-selector {
            margin-top: 15px;
            text-align: left;
        }

        .track-selector label {
            display: block;
            font-size: 0.8rem;
            color: #bbb;
            margin-bottom: 5px;
        }

        .track-selector select {
            width: 100%;
            padding: 10px;
            background: rgba(15, 20, 30, 0.85);
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .track-selector select:focus {
            border-color: #00ffcc;
        }

        .deck-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-play {
            flex: 1;
            padding: 10px;
            background: #00ffcc;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-play:hover {
            background: #00cca3;
            box-shadow: 0 0 10px rgba(0,255,204,0.6);
        }

        .btn-pause {
            flex: 1;
            padding: 10px;
            background: #ff007f;
            color: #fff;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-pause:hover {
            background: #d00067;
            box-shadow: 0 0 10px rgba(255,0,127,0.6);
        }

        .hidden-player {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .mixer-controls {
            background: rgba(10, 15, 25, 0.75);
            border-top: 2px solid #00ffcc;
            padding: 15px 40px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
        }

        .fader-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .fader-group label {
            font-size: 0.8rem;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 220px;
            background: #222;
            height: 6px;
            border-radius: 3px;
            outline: none;
            border: 1px solid #444;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff007f;
            cursor: pointer;
            box-shadow: 0 0 8px #ff007f;
        }

        footer {
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.85);
            width: 100%;
            font-size: 0.75rem;
            color: #888;
        }

        @media (max-width: 900px) {
            .deck {
                width: 100%;
                max-width: 450px;
            }
            .mixer-controls {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>ALPINE RAVE 3000M</h1>
        <p>High-Altitude Afro-House DJ Booth | Dual Deck Experience</p>
    </header>

    <div class="dj-booth-container">
        <!-- DECK A -->
        <div class="deck" id="deck-a-box">
            <h2>Deck A <span>[Master A]</span></h2>
            
            <!-- Barras Multicolor Ecualizador en lugar de plato opaco -->
            <div class="equalizer-container" id="eq-a">
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
            </div>

            <div class="track-selector">
                <label for="select-a">Seleccionar Track (Deck A):</label>
                <select id="select-a" onchange="onTrackChange('a')">
                    <option value="https://soundcloud.com/aaron-sevilla/afrohouse-mesa-que-ma-s">1. Mesa que más aplauda</option>
                    <option value="https://soundcloud.com/aaron-sevilla/valgame-dios">2. Válgame Dios</option>
                    <option value="https://soundcloud.com/aaron-sevilla/aaron-sevilla-afrodise-tulum">3. Afrodise Tulum</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afrohouse-habibi-weinak">4. Habibi Weinak</option>
                    <option value="https://soundcloud.com/aaron-sevilla/aaron-sevilla-afrohouse-dj-set-at-mia-tulum">5. Live at Mia Tulum</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afrohouse-interestellar">6. Interestellar</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afrohouse-tengo" selected>7. Tengo</option>
                    <option value="https://soundcloud.com/aaron-sevilla/aaron-sevilla-afrodise-dubai-afro-house">8. Afrodise Dubai</option>
                    <option value="https://soundcloud.com/aaron-sevilla/aaron-sevilla-plaza-espana">9. Plaza España Set</option>
                    <option value="https://soundcloud.com/aaron-sevilla/desa-kitsune-bali-2025-afro-house-afro-latin-house">10. Desa Kitsune Bali</option>
                </select>
            </div>
            <div class="deck-btns">
                <button class="btn-play" onclick="playTrack('a')">PLAY</button>
                <button class="btn-pause" onclick="pauseTrack('a')">STOP</button>
            </div>
            <div class="hidden-player">
                <iframe id="sc-player-a" width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/afrohouse-tengo&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false"></iframe>
            </div>
        </div>

        <!-- DECK B -->
        <div class="deck" id="deck-b-box">
            <h2>Deck B <span>[Master B]</span></h2>
            
            <!-- Barras Multicolor Ecualizador en lugar de plato opaco -->
            <div class="equalizer-container" id="eq-b">
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
            </div>

            <div class="track-selector">
                <label for="select-b">Seleccionar Track (Deck B):</label>
                <select id="select-b" onchange="onTrackChange('b')">
                    <option value="https://soundcloud.com/aaron-sevilla/afrohouse-jaguar" selected>1. Jaguar</option>
                    <option value="https://soundcloud.com/aaron-sevilla/caracas-venezuela-techraza-exclusive-afro-house-dj-set">2. Caracas Techraza Exclusive</option>
                    <option value="https://soundcloud.com/aaron-sevilla/el-rey">3. El Rey</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afrohouse-01-a-dos-amigos">4. A Dos Amigos</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afro-house-dj-set-at-yona-beach-2025">5. Yona Beach 2025</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afrohouse-da-iubirea-mai-tare">6. Da Iubirea Mai Tare</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afro-house-aaronsevilla-3">7. AaronSevilla 3</option>
                    <option value="https://soundcloud.com/aaron-sevilla/aaron-sevilla-at-cova-santa-ibiza">8. Cova Santa Ibiza</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afrohouse-aaronsevilla-1">9. AaronSevilla 1</option>
                    <option value="https://soundcloud.com/aaron-sevilla/afro-house-aaron-sevilla-8">10. Aaron Sevilla 8</option>
                </select>
            </div>
            <div class="deck-btns">
                <button class="btn-play" onclick="playTrack('a')">PLAY</button>
                <button class="btn-pause" onclick="pauseTrack('b')">STOP</button>
            </div>
            <div class="hidden-player">
                <iframe id="sc-player-b" width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aaron-sevilla/afrohouse-jaguar&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false"></iframe>
            </div>
        </div>
    </div>

    <!-- MESA DE MEZCLAS CENTRAL -->
    <div class="mixer-controls">
        <div class="fader-group">
            <label>Master Volume</label>
            <input type="range" id="master-volume" min="0" max="100" value="80" oninput="updateMasterVolume()">
        </div>
        <div class="fader-group">
            <label>Crossfader [Deck A &lt;-&gt; Deck B]</label>
            <input type="range" id="crossfader" min="0" max="100" value="50" oninput="updateCrossfader()">
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Alpine Rave 3000m Project | Built for high-altitude sessions</p>
    </footer>

    <!-- SoundCloud Widget API Script -->
    <script src="https://w.soundcloud.com/player/api.js"></script>
    <script>
        let widgetA, widgetB;
        let isReadyA = false, isReadyB = false;

        document.addEventListener('DOMContentLoaded', () => {
            const iframeA = document.getElementById('sc-player-a');
            const iframeB = document.getElementById('sc-player-b');

            widgetA = SC.Widget(iframeA);
            widgetB = SC.Widget(iframeB);

            widgetA.bind(SC.Widget.Events.READY, () => {
                isReadyA = true;
                updateCrossfader();
            });

            widgetB.bind(SC.Widget.Events.READY, () => {
                isReadyB = true;
                updateCrossfader();
            });
        });

        function playTrack(deck) {
            const widget = deck === 'a' ? widgetA : widgetB;
            const isReady = deck === 'a' ? isReadyA : isReadyB;
            const eq = document.getElementById(`eq-${deck}`);

            if (widget && isReady) {
                widget.play();
                if (eq) eq.classList.add('playing');
            } else if (widget) {
                // Si la API aún no dio el READY exacto, forzamos play tras el click
                widget.play();
                if (eq) eq.classList.add('playing');
            }
        }

        function pauseTrack(deck) {
            const widget = deck === 'a' ? widgetA : widgetB;
            const eq = document.getElementById(`eq-${deck}`);

            if (widget) {
                widget.pause();
                if (eq) eq.classList.remove('playing');
            }
        }

        function onTrackChange(deck) {
            const selectVal = document.getElementById(`select-${deck}`).value;
            const widget = deck === 'a' ? widgetA : widgetB;
            const eq = document.getElementById(`eq-${deck}`);

            if (widget) {
                widget.load(selectVal, {
                    auto_play: true,
                    callback: function() {
                        widget.play();
                        if (eq) eq.classList.add('playing');
                        updateCrossfader();
                    }
                });
            }
        }

        function updateMasterVolume() {
            const vol = document.getElementById('master-volume').value;
            if (widgetA && isReadyA) widgetA.setVolume(vol);
            if (widgetB && isReadyB) widgetB.setVolume(vol);
        }

        function updateCrossfader() {
            const val = parseFloat(document.getElementById('crossfader').value);
            const masterVol = parseFloat(document.getElementById('master-volume').value);
            
            let volA = masterVol;
            let volB = masterVol;

            if (val < 50) {
                volB = masterVol * (val / 50);
            } else if (val > 50) {
                volA = masterVol * ((100 - val) / 50);
            }

            if (widgetA && isReadyA) widgetA.setVolume(volA);
            if (widgetB && isReadyB) widgetB.setVolume(volB);
        }
    </script>

</body>
</html>
